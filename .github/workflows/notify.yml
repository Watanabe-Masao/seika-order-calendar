name: LINE通知

on:
  schedule:
    # cron はUTC。GitHub のスケジュール実行は遅れたり実行されなかったりすることがあるため、
    # 30分おきに複数回動かす。同じ日・同じ本文は LINE 側のリトライキーで受付済みになり、二重には届かない。
    - cron: "7 6 * * *"    # 前日の予告 15:07 JST
    - cron: "37 6 * * *"   # 前日の予告 15:37 JST（予備）
    - cron: "7 7 * * *"    # 前日の予告 16:07 JST（予備）
    - cron: "7 22 * * *"   # 当日の通知  7:07 JST
    - cron: "37 22 * * *"  # 当日の通知  7:37 JST（予備）
    - cron: "7 23 * * *"   # 当日の通知  8:07 JST（予備）
  workflow_dispatch:
    inputs:
      when:
        description: "day=当日の通知（今日が対象） / eve=前日の予告（明日が対象）"
        type: choice
        options: [day, eve]
        default: day
      date:
        description: "対象の発注日（YYYY-MM-DD）。空なら when に応じて今日／明日"
        required: false
        default: ""
      dry_run:
        description: "送信せずに本文だけ確認する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 通知
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          WHEN: ${{ inputs.when }}
          DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          case "$SCHEDULE" in
            "7 6 * * *"|"37 6 * * *"|"7 7 * * *")    WHEN=eve; args+=(--scheduled) ;;
            "7 22 * * *"|"37 22 * * *"|"7 23 * * *") WHEN=day; args+=(--scheduled) ;;
          esac
          if [ -z "$WHEN" ]; then WHEN=day; fi
          args+=(--when "$WHEN")
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/notify.mjs "${args[@]}"
