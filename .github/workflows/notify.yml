name: LINE通知

on:
  schedule:
    # 毎日 17:07 JST（cron はUTC）。翌日がまとめ発注・いつもと違う発注日なら配信
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "対象の発注日（YYYY-MM-DD）。空なら明日"
        required: false
        default: ""
      dry_run:
        description: "送信せずに本文だけ確認する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 通知
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/notify.mjs "${args[@]}"
